<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Parcel · Shop the finds</title>
<meta name="theme-color" content="#b3173a">
<meta name="description" content="Every product from The Daily Parcel videos, with a link to it on Amazon.">
<meta property="og:title" content="The Daily Parcel · Shop the finds">
<meta property="og:description" content="Saw it in a video? Find it here.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: crimson brand band (matches the YouTube banner), sticky search + category bar, 2-up (phone) to 5-up product grid, newest first */
:root {
  --bg: #15171a;
  --card: #1f2226;
  --ink: #f2f3f5;
  --muted: #9aa0a8;
  --line: #2c3036;
  --crimson: #b3173a;
  --crimson-deep: #8e1230;
  --blue: #4aa3f5;
  --orange: #c41d45;
  --orange-ink: #ffffff;
  --chip: #2a2e34;
  --font: "Montserrat", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;   /* one premium charcoal look on every device, by choice */
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

.brand { background: radial-gradient(120% 140% at 50% 0%, var(--crimson) 0%, var(--crimson-deep) 100%); color: #fff; }
header { padding-top: calc(26px + env(safe-area-inset-top, 0px)); padding-bottom: 22px; text-align: center; }
.mark { display: inline-block; font-weight: 800; font-size: clamp(32px, 9vw, 52px); letter-spacing: -0.02em; line-height: 1.05; text-decoration: none; color: #fff; }
.mark .p { position: relative; color: var(--blue); }
.mark .p svg { position: absolute; left: 8%; right: 8%; width: 84%; top: 100%; height: auto; margin-top: -2px; }
.tagline { margin: 22px 0 0; font-weight: 700; font-size: 16px; }
.sub { margin: 4px 0 0; color: rgba(255, 255, 255, .78); font-size: 13px; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px 8px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#q { width: 100%; font: 600 16px var(--font); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 12px 16px 12px 42px; outline: none; -webkit-appearance: none; appearance: none; }
#q:focus { border-color: var(--orange); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 700 13px var(--font); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { padding-block: 16px 24px; }
.status { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1120px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.card { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 0 var(--line); }
.pic { position: relative; display: block; aspect-ratio: 1 / 1; background: #ffffff; overflow: hidden; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 10px; display: block; }
.new { z-index: 1; }
.new { position: absolute; top: 8px; left: 8px; background: var(--blue); color: var(--orange-ink); font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.short { font-weight: 800; font-size: 15px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
.full { color: var(--muted); font-size: 11.5px; font-weight: 500; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.buy { margin-top: auto; display: block; text-align: center; text-decoration: none; background: var(--orange); color: var(--orange-ink); font-weight: 800; font-size: 13.5px; border-radius: 10px; padding: 10px 8px; }
.buy:hover { filter: brightness(1.05); }
.buy:focus-visible, .chip:focus-visible, .more:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.body .spacer { height: 6px; }

.more { display: block; margin: 20px auto 0; font: 800 14px var(--font); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
.empty { text-align: center; padding: 36px 8px; }
.empty strong { display: block; font-size: 17px; margin-bottom: 4px; }
.empty span { color: var(--muted); font-size: 14px; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center; padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px)); }
footer p { margin: 0 auto 6px; max-width: 60ch; }
</style>
</head>
<body>
<div class="brand"><header class="wrap">
  <a class="mark" href="./" aria-label="The Daily Parcel">
    The Daily <span class="p">Parcel<svg viewBox="0 0 200 30" aria-hidden="true"><path d="M10 6 Q100 40 190 6" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/></svg></span>
  </a>
  <p class="tagline">Saw it in a video? Find it here.</p>
  <p class="sub">Newest finds first · tap a product to see it on Amazon</p>
</header></div>

<div class="bar">
  <div class="wrap">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="What did you see? e.g. blanket" autocomplete="off" enterkeyhint="search" aria-label="Search products">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>
</div>

<main class="wrap">
  <p class="status" id="status"></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" type="button" hidden>Show more</button>
</main>

<footer class="wrap">
  <p><strong>#ad</strong> · As an Amazon Associate I earn from qualifying purchases. Buying through these links doesn't cost you anything extra.</p>
  <p>Prices and availability are shown on Amazon and can change.</p>
</footer>

<script src="products.js"></script>
<script>
const ALL = (window.PRODUCTS || []).slice();
const CATS = ["New", "Pets", "Beauty", "Kitchen", "Home", "Tech", "Travel", "Gifts"];
const PAGE = 30;
const newest = ALL.reduce((m, p) => (p.date > m ? p.date : m), "");
const daysBetween = (a, b) => (new Date(a) - new Date(b)) / 864e5;
ALL.forEach((p) => {
  p.isNew = newest && daysBetween(newest, p.date) <= 2;
  p.words = norm([p.short, p.name, p.kw, (p.cats || []).join(" ")].join(" ")).split(" ").filter(Boolean).map(stem);
  p.shortWords = norm(p.short).split(" ").filter(Boolean).map(stem);
});

let state = { q: "", cat: "All", shown: PAGE };
try {
  const u = new URL(location.href);
  state.q = u.searchParams.get("q") || "";
  const c = (location.hash || "").slice(1);
  if (CATS.includes(c)) state.cat = c;
} catch (e) {}

function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
// one typo allowed in words of 4+ letters ("tortila" → tortilla, "blankit" → blanket)
function close(t, w) {
  if (t.length < 4) return false;
  for (const cut of [t.length - 1, t.length, t.length + 1]) {
    const a = t, b = w.slice(0, cut);
    if (Math.abs(a.length - b.length) > 1 || b.length < 3) continue;
    let i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) break;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    if (edits + (a.length - i) + (b.length - j) <= 1) return true;
  }
  return false;
}
function stem(w) { return w.length > 3 ? w.replace(/(ies)$/, "y").replace(/(es|s)$/, "") : w; }

function results() {
  const toks = norm(state.q).split(" ").filter(Boolean).map(stem);
  let list = ALL.filter((p) => {
    if (state.cat === "New" && !p.isNew) return false;
    if (state.cat !== "All" && state.cat !== "New" && !(p.cats || []).includes(state.cat)) return false;
    return toks.every((t) => p.words.some((w) => w.startsWith(t) || close(t, w)));
  });
  if (toks.length) {
    const score = (p) => toks.filter((t) => p.shortWords.some((w) => w.startsWith(t))).length;
    list = list.map((p, i) => [score(p), i, p]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).map((x) => x[2]);
  }
  return list;
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function card(p) {
  return `<article class="card">
    <a class="pic" href="${esc(p.url)}" target="_blank" rel="sponsored nofollow noopener" aria-label="${esc(p.short)} on Amazon">
      <img src="${esc(p.img)}" alt="${esc(p.short)}" loading="lazy" width="500" height="500">
      ${p.isNew ? '<span class="new">New</span>' : ""}
    </a>
    <div class="body">
      <h2 class="short">${esc(p.short)}</h2>
      <p class="full">${esc(p.name)}</p>
      <div class="spacer"></div>
      <a class="buy" href="${esc(p.url)}" target="_blank" rel="sponsored nofollow noopener">Shop on Amazon</a>
    </div>
  </article>`;
}

function renderChips() {
  const present = new Set(ALL.flatMap((p) => p.cats || []));
  const list = ["All", ...CATS.filter((c) => c === "New" || present.has(c))];
  document.getElementById("chips").innerHTML = list.map((c) =>
    `<button class="chip" type="button" data-cat="${c}" aria-pressed="${state.cat === c}">${c}</button>`).join("");
}

function render() {
  const list = results();
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  if (!list.length) {
    status.textContent = "";
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>No match${state.q ? ` for “${esc(state.q)}”` : ""}</strong><span>Try one simple word, like “blanket”, “dog” or “lip”.</span></div>`;
    document.getElementById("more").hidden = true;
    return;
  }
  const label = state.q ? `${list.length} match${list.length === 1 ? "" : "es"}` : state.cat === "All" ? `${list.length} finds, newest first` : `${list.length} in ${state.cat}`;
  status.textContent = label;
  grid.innerHTML = list.slice(0, state.shown).map(card).join("");
  document.getElementById("more").hidden = list.length <= state.shown;
}

document.getElementById("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  state.cat = b.dataset.cat; state.shown = PAGE;
  try { history.replaceState(null, "", state.cat === "All" ? location.pathname + location.search : "#" + state.cat); } catch (err) {}
  renderChips(); render();
});
const q = document.getElementById("q");
q.value = state.q;
let t = null;
q.addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(() => {
    state.q = q.value; state.shown = PAGE;
    try { const u = new URL(location.href); state.q ? u.searchParams.set("q", state.q) : u.searchParams.delete("q"); history.replaceState(null, "", u); } catch (err) {}
    render();
  }, 120);
});
q.addEventListener("keydown", (e) => { if (e.key === "Enter") q.blur(); });
document.getElementById("more").addEventListener("click", () => { state.shown += PAGE; render(); });

renderChips();
render();
</script>
</body>
</html>
